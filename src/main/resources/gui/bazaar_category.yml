# Category grid. Entries from the category config fill the mask's "0" slots and page themselves.
#   category declares groups:  'group-content' renders one icon per group (un-grouped items use 'content')
#   category has no groups:    'content' renders the products directly

title: "&8Bazaar &7» &f%rbazaar_category%"
command: []
rows: 6

forwards-arrow:
  item: arrow name:"&fNext Page"
  enabled: true
  row: 6
  column: 8

backwards-arrow:
  item: arrow name:"&fPrevious Page"
  enabled: true
  row: 6
  column: 2

# Category rail: one icon per category, taken from each category's own config. Drawn over the mask.
category-rail:
  enabled: true
  column: 1
  rows: [1, 2, 3, 4, 5]
  glint-selected: true
  lore:
    - "&7Click to browse this category."

# The "0" slots below are the live area; entries flow into them in order. Edit the pattern to reshape it.
# To pin an entry to a square, give it a row/column (or a raw slot) in its categories/*.yml entry:
#       wheat:
#         item: minecraft:wheat
#         row: 2
#         column: 3
#   Pinned entries hold their square on the first page; everything else fills in around them.

# Plays whenever the menu opens. Navigation buttons should not add their own play_sound (it would
# double up); buttons that only re-render the menu (buy, sell, sell all) need one, since a refresh is silent.
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "110000001"
        - "110000001"
        - "110000001"
        - "110000001"
        - "111111111"

# One icon per group, for categories that declare groups:. The summary is recomputed on every draw.
group-content:
  template:
    item: "%rbazaar_group_icon%"
    name: "%rbazaar_group_name%"
    lore:
      - "&7%rbazaar_group_size% &7products"
      - "&7From &a$%rbazaar_group_min_buy%"
      - "&7Trend: %rbazaar_group_trend% &7(%rbazaar_group_change_24h% 24h)"
      - "&8%rbazaar_group_volume_24h% traded in 24h"
      - ""
      - "&eLeft-click &7to browse."
    left-click:
      - id: open_menu
        args:
          menu: bazaar_group
          category: "%rbazaar_category_id%"
          group: "%rbazaar_group%"

# One entry per bazaar item. Used directly by flat categories, and for any items a grouped
# category left without a group:.
content:
  template:
    item: "%rbazaar_item%"
    name: "%rbazaar_item_display%"
    lore:
      - "&7Buy:  &a$%rbazaar_buy_price%"
      - "&7Sell: &e$%rbazaar_sell_price%"
      - "&7Trend: %rbazaar_trend% &7(%rbazaar_change_24h% 24h)"
      - ""
      - "&eLeft-click &7to open."
    left-click:
      - id: rbazaar_open_product
        args:
          item: "%rbazaar_item%"

slots:
  # Sells the whole inventory; inside a group menu it sells only that group's items.
  - item: chest name:"&6Sell All"
    lore:
      - "&7Sell every item in your inventory"
      - "&7that the bazaar buys."
      - ""
      - "&eClick to sell"
    row: 6
    column: 3
    left-click:
      - id: rbazaar_sell_all
      - id: play_sound
        args:
          sound: ui_button_click
          pitch: 1
          volume: 1
  - item: oak_sign name:"&bSearch"
    lore:
      - "&7Search the bazaar for an item"
      - "&7by name."
      - ""
      - "&eClick to search"
    row: 6
    column: 1
    left-click:
      - id: rbazaar_search

  - item: barrier name:"&cClose"
    lore: []
    row: 6
    column: 5
    left-click:
      - id: close_inventory

  - item: filled_map name:"&6Market Trends"
    lore:
      - "&7Today's biggest risers and"
      - "&7fallers, and the most-traded"
      - "&7items on the bazaar."
      - ""
      - "&eClick to view"
    row: 6
    column: 7
    left-click:
      - id: rbazaar_open_trends
