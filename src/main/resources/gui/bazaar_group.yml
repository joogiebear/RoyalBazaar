# Group grid (category, group, product), opened from a group icon. The group's items fill the
# mask's "0" slots and page themselves.

title: "&f%rbazaar_category% &7» &f%rbazaar_group_name%"
command: []
rows: 6

forwards-arrow:
  item: arrow name:"&fNext Page"
  enabled: true
  row: 6
  column: 8

backwards-arrow:
  item: arrow name:"&fPrevious Page"
  enabled: true
  row: 6
  column: 2

# Category rail, see bazaar_category.yml.
category-rail:
  enabled: true
  column: 1
  rows: [1, 2, 3, 4, 5]
  glint-selected: true
  lore:
    - "&7Click to browse this category."

# The "0" slots below are the live area; entries flow into them in order. Edit the pattern to reshape it.
# To pin an entry to a square, give it a row/column (or a raw slot) in its categories/*.yml entry:
#       wheat:
#         item: minecraft:wheat
#         row: 2
#         column: 3
#   Pinned entries hold their square on the first page; everything else fills in around them.

# Plays whenever the menu opens. Navigation buttons should not add their own play_sound (it would
# double up); buttons that only re-render the menu (buy, sell, sell all) need one, since a refresh is silent.
sounds:
  open:
    enabled: true
    name: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2

pages:
  - page: 1
    mask:
      items:
        - black_stained_glass_pane
      pattern:
        - "111111111"
        - "100000001"
        - "100000001"
        - "100000001"
        - "100000001"
        - "111111111"

# Fills the "0" slots. One entry per product in this group.
content:
  template:
    item: "%rbazaar_item%"
    name: "%rbazaar_item_display%"
    lore:
      - "&7Buy:  &a$%rbazaar_buy_price%"
      - "&7Sell: &e$%rbazaar_sell_price%"
      - "&7Trend: %rbazaar_trend% &7(%rbazaar_change_24h% 24h)"
      - ""
      - "&eLeft-click &7to open."
    left-click:
      - id: rbazaar_open_product
        args:
          item: "%rbazaar_item%"

slots:
  - item: hopper name:"&6Sell All"
    lore:
      - "&7Sell every item in your inventory"
      - "&7that belongs to this group."
      - ""
      - "&eClick to sell"
    row: 6
    column: 3
    left-click:
      - id: rbazaar_sell_all
      - id: play_sound
        args:
          sound: ui_button_click
          pitch: 1
          volume: 1
  - item: oak_sign name:"&bSearch"
    lore:
      - "&7Search the bazaar for an item"
      - "&7by name."
      - ""
      - "&eClick to search"
    row: 6
    column: 7
    left-click:
      - id: rbazaar_search

  # Back goes to the parent category.
  - item: arrow name:"&7« Back"
    lore:
      - "&7Back to %rbazaar_category%"
    row: 6
    column: 4
    left-click:
      - id: rbazaar_back

  - item: barrier name:"&cClose"
    lore: []
    row: 6
    column: 6
    left-click:
      - id: close_inventory
